; uCap v1 firmware — STM32G474CEUx (QFN-48)
; Pin map and nets taken from ucap/ucap.kicad_sch + README.md

[env:ucap]
platform = ststm32
framework = arduino
board = genericSTM32G474RE
board_build.mcu = stm32g474ceu6
board_build.f_cpu = 170000000L
board_build.usb_product = "uCap"
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

build_flags =
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D USBCON
  -D USBD_VID=0x0483
  -D USBD_PID=0x5740
  -D HAL_COMP_MODULE_ENABLED
  -D HAL_ADC_MODULE_ENABLED
  -D HAL_DMA_MODULE_ENABLED
  -I include

lib_deps =
  sparkfun/SparkFun VL53L5CX Arduino Library @ ^1.0.3

lib_ldf_mode = deep+
